<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Démo Gratuite — AiPilote</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #12181f;
      --card:    #151d27;
      --border:  #1e2d3d;
      --cyan:    #00e5ff;
      --text:    #ffffff;
      --muted:   #5a7080;
      --input-bg:#0d1117;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 80px;
    }

    body::before {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(0,229,255,0.09) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 44px;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      border: 1px solid rgba(0,229,255,0.25);
      padding: 6px 16px;
      border-radius: 99px;
      background: rgba(0,229,255,0.05);
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:0.4;transform:scale(1.5)}
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
    }
    .logo span { color: var(--cyan); }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 800;
      line-height: 1.15;
    }
    h1 em { font-style: normal; color: var(--cyan); }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.7;
    }

    .form-card {
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 40px 36px;
      position: relative;
      z-index: 1;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    }
    .form-card::before {
      content: '';
      position: absolute;
      top: -1px; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    }

    .step {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 28px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .num {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: rgba(0,229,255,0.1);
      border: 1px solid rgba(0,229,255,0.3);
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    input[type="text"],
    input[type="url"],
    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: vertical;
    }
    input[type="text"]:focus,
    input[type="url"]:focus,
    textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
    }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    textarea { min-height: 110px; }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0 28px;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--cyan);
      color: #000;
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 28px rgba(0,229,255,0.3);
      margin-top: 8px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 44px rgba(0,229,255,0.5);
    }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      z-index: 1;
    }
    footer strong { color: var(--cyan); }

    @media (max-width: 500px) {
      .form-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">Chatbot AI · Disponible 24h/24</div>
    <div class="logo">Ai <span>Pilote</span></div>
    <h1>Demandez votre<br/><em>démo gratuite</em></h1>
    <p class="subtitle">Répondez à ces quelques questions et je configure votre chatbot IA personnalisé en 48h.</p>
  </header>

  <div class="form-card">
    <form action="https://formspree.io/f/maqpnegl" method="POST">

      <!-- Redirection après envoi -->
      <input type="hidden" name="_next" value="https://kemidufranc.github.io/AiPilote/merci.html"/>

      <div class="step">
        <label><span class="num">1</span> Nom de votre entreprise ?</label>
        <input type="text" name="Nom entreprise" placeholder="Ex : Salon Beauté Paris" required/>
      </div>
      <hr class="divider"/>

      <div class="step">
        <label><span class="num">2</span> URL de votre site web ?</label>
        <input type="url" name="Site web" placeholder="https://www.monsite.com" required/>
      </div>
      <hr class="divider"/>

      <div class="step">
        <label><span class="num">3</span> Secteur d'activité ?</label>
        <input type="text" name="Secteur activite" placeholder="Ex : Coiffure, Restaurant, Immobilier…" required/>
      </div>
      <hr class="divider"/>

      <div class="step">
        <label><span class="num">4</span> Les 5 questions que vos clients posent le plus souvent ?</label>
        <textarea name="Questions frequentes" placeholder="1. Quels sont vos horaires ?&#10;2. Où êtes-vous situé ?&#10;3. …&#10;4. …&#10;5. …" required></textarea>
      </div>
      <hr class="divider"/>

      <div class="step">
        <label><span class="num">5</span> Horaires d'ouverture ?</label>
        <input type="text" name="Horaires" placeholder="Ex : Lun–Ven 9h–18h, Sam 10h–15h" required/>
      </div>
      <hr class="divider"/>

      <div class="step">
        <label><span class="num">6</span> Tarifs ou produits à mentionner ?</label>
        <textarea name="Tarifs produits" placeholder="Ex : Coupe femme 45€, Couleur 80€…" required></textarea>
      </div>
      <hr class="divider"/>

      <div class="step">
        <label><span class="num">7</span> Comment le chatbot doit-il se présenter ?</label>
        <textarea name="Presentation chatbot" placeholder="Ex : &quot;Bonjour, je suis Lisa, l'assistante de [Salon]…&quot;" required></textarea>
      </div>

      <button type="submit" class="btn-submit">✦ Envoyer ma demande</button>
    </form>
  </div>

  <footer>✦ <strong>AiPilote</strong> — Propulsé par l'intelligence artificielle</footer>

</body>
</html>
